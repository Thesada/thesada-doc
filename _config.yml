title: "Thesada"
description: "Open-source modular ESP32 firmware framework for production IoT products: pull OTA with SHA256 verification, telemetry, runtime config, MQTT over TLS, cellular fallback, a remote shell and a Lua runtime. Grew out of off-grid property monitoring."
url: "https://thesada.io"
baseurl: ""

social:
  name: Thesada
  links:
    - https://github.com/Thesada
    - https://youtube.com/@FoothillsBuilds
    - https://foothillsbuilds.com

theme: just-the-docs

plugins:
  - jekyll-seo-tag
  - jekyll-feed

search_enabled: true
heading_anchors: true

color_scheme: dark
mermaid:
  version: "10.9.0"
nav_sort: case_insensitive

footer_content: "Thesada - AGPL-3.0-only (app) / GPL-3.0-only (firmware) / CC BY-NC-SA 4.0 (docs) - <a href='/legal/license.html'>License</a>"

aux_links:
  "GitHub":
    - "https://github.com/Thesada"
  "YouTube":
    - "https://youtube.com/@FoothillsBuilds"
  "Blog":
    - "https://foothillsbuilds.com"

aux_links_new_tab: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache